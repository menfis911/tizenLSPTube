name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/test-start.cjs
      - run: node tests/test-https.cjs
      - run: node tests/test-single.cjs
      - run: node tests/integration-single.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/build.py
      - run: python3 scripts/build.py --single
      - uses: actions/upload-artifact@v4
        with:
          name: LSPTube-unsigned
          path: dist/
